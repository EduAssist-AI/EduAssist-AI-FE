<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Single Page Application routing fix for GitHub Pages
      var basePath = '/EduAssist-AI-FE';
      var path = window.location.pathname;
      
      // Remove base path to get the actual route
      var route = path.replace(basePath, '') || '/';
      
      // Redirect to index.html with the route as hash
      // React Router will read the hash and navigate to the correct page
      window.location.replace(basePath + '/#' + route);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
